plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.loan_org'
version = 'IAM-Service-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'com/loan_org/identity_and_access_management/IdentityAndAccessManagementApplication.class'
            ])
        }))
    }
}

dependencies {

    // Starter implementations for SPRING (CORE dependencies)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Microservice registration (Netflix Eureka)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // JWT library
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Rate Limiter library
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.19.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // Logging library
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'


    // Lombok Annotation Processor
    compileOnly             'org.projectlombok:lombok'
    annotationProcessor     'org.projectlombok:lombok'
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // JSpecify (since NonNull is deprecated)
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Test-related libraries
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Testcontainers BOM (Bill of Materials) to align versions flawlessly
    testImplementation platform("org.testcontainers:testcontainers-bom:1.19.7")

    // Testcontainers modules for JUnit 5, Mongo, and RabbitMQ
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:rabbitmq'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.2"
    }
}

tasks.register('e2eTest', Test) {
    description = 'Runs all End-to-End infrastructure scenario suites ending with E2ETest.'
    group = 'verification'

    // Explicit source set paths so your test classes compile smoothly
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()

    // Dynamically targets all E2E classes globally across packages
    include '**/*E2ETest.class'

    // Forces execution on every run even if no files changed
    outputs.upToDateWhen { false }
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/*E2ETest.class'
    finalizedBy jacocoTestReport
}