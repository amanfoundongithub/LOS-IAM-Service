name: Java CI Build Status

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # REQ: Needed to attach the coverage summary tables to the workflow run
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build and Run Tests with Gradle Wrapper
        run: ./gradlew build

      # --- NEW: Parse JaCoCo XML and post the results summary ---
      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@v5.1
        with:
          # Path to the generated XML report inside your workspace
          coverage_results_path: build/reports/jacoco/test/jacocoTestReport.xml
          coverage_report_name: Code Coverage Summary
          coverage_report_title: JaCoCo Test Coverage
          # If your coverage falls below 60%, fail the build pipeline
          min_coverage_overall: 60