# Spring configuration
spring:
  profiles:
    active: local
  application:
    name: iam-service
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  mongodb:
    uri: ${MONGO_URI}

# Server port configuration
server:
  port: 4200

# Eureka registry configuration
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST}:8761/eureka/

# Actuator endpoint configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: "Service to manage identity and access"
    version: 1.0.0
  base_url: "/api/v1/auth"

app:
  base-url: http://localhost:4200/api/v1/auth

# Filter Level Configuration
filter:
  mdc:
    trace:
      header: X-Trace-Id
      key: traceId
    correlation:
      header: X-Correlation-Id
      key: correlationId
  rateLimiter:
    apiKey:
      header: X-API-KEY
    forwardedFor:
      header: X-Forwarded-For
    retryAfter:
      header: Retry-After
      seconds: 60
    bucket:
      capacity: 500
      refill: 500
      intervalInMinutes: 1
      cache:
        maxSize: 10000
        expiresAfterHour: 1

# Thread level Configuration for Async Processing
threadConfig:
  async:
    corePoolSize: 5
    maxPoolSize: 10
    queueCapacity: 500
    threadNamePrefix: "iam-async-"

# Security configuration
security-config:
  cors:
    allowed_origins:
      - "http://localhost:4200"
      - "http://localhost:3000"
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed_headers:
      - "Authorization"
      - "Content-Type"
      - "Cache-Control"
      - "X-Requested-With"
    exposed_headers:
      - "Authorization"
    allow_credentials: true
    max_age: 3600

# Endpoint related configuration
api: 
  auth:
    base_url: /api/v1/auth 
  admin:
    base_url: /api/v1/admin 
  user: 
    base_url: /api/v1/users

  endpoint: 
    login:
      url: /api/v1/auth/login
      config:
        max_attempts: 5
        lockout_in_minutes: 15
    register:
      url: /api/v1/auth/register
    refresh_token:
      url: /api/v1/auth/refresh
    verify_email:
      url: /api/v1/auth/verify-email
    logout:
      url: /api/v1/auth/logout
    password:
      url: /api/v1/auth/password
    admin: 
      url: /api/v1/auth/admin
    allRoles:
      url: /api/v1/auth/allUserRoles

# Token configuration
token: 
  refresh_token:
    expiry_in_days: 30
  email_activation_token:
    expiry_in_hours: 24
  password_reset_token:
    expiry_in_hours: 20

# JWT related configurations
jwt:
  secret:
    key: ${JWT_SECRET_KEY}

  metadata:
    issuer: ${spring.application.name}
    expiration_in_minutes: 30