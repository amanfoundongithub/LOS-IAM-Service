<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333; margin: 0; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; padding: 30px; border-radius: 8px;">
    <h2 style="color: #c0392b;">Password Reset Request</h2>
    <p>Hi <span th:text="${name}">User</span>,</p>
    <p>We received a request to reset your password. Click the button below to choose a new one:</p>
    <div style="margin: 30px 0; text-align: center;">
        <a th:href="${resetUrl}"
           style="background-color: #e74c3c; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
            Reset Password
        </a>
    </div>
    <p style="font-size: 12px; color: #7f8c8d;">This recovery link will expire in 15 minutes. If you didn't request this, your password will remain secure and unchanged.</p>
</div>
</body>
</html>
