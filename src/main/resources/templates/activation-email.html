<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activate Your Account</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333; margin: 0; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; padding: 30px; border-radius: 8px;">
    <h2 style="color: #2c3e50;">Welcome to Apex Lending!</h2>
    <p>Hi <span th:text="${name}">User</span>,</p>
    <p>Thanks for signing up. Please click the button below to verify your email address and activate your account:</p>
    <div style="margin: 30px 0; text-align: center;">
        <a th:href="${activationUrl}"
           style="background-color: #3498db; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
            Activate Account
        </a>
    </div>
    <p style="font-size: 12px; color: #7f8c8d;">This link will expire in 24 hours. If you did not create an account, please ignore this email.</p>
</div>
</body>
</html>
