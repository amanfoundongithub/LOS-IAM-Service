<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Reset - Apex Lending</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h2 {
            color: #2c3e50;
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        .header p {
            color: #7f8c8d;
            font-size: 14px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .error-banner {
            background-color: #fde8e8;
            color: #e74c3c;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #e74c3c;
        }
        /* Success Screen Overlays */
        .success-state {
            display: none;
            text-align: center;
        }
        .success-icon {
            width: 70px;
            height: 70px;
            background-color: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin: 0 auto 20px auto;
        }
        .countdown {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="card" id="recoveryCard">
    <!-- 1. The Interactive Input Form Area -->
    <div id="formState">
        <div class="header">
            <h2>Create New Password</h2>
            <p>Please enter your secure access credentials below.</p>
        </div>

        <!-- Dynamic backend server error display wrapper -->
        <div class="error-banner" id="errorBlock"
             th:style="${errorMessage != null} ? 'display: block' : 'display: none'"
             th:text="${errorMessage}">
        </div>

        <!-- Using POST method to match your updated controller configuration -->
        <form id="resetForm" action="password/execute-reset" method="POST">
            <!-- Stores verification reference dynamically injected via Thymeleaf View Mapping -->
            <input type="hidden" name="token" id="tokenField" th:value="${token}" />

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="newPassword" required minlength="8" placeholder="••••••••" />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••" />
            </div>

            <button type="submit" id="submitBtn">Update Password</button>
        </form>
    </div>

    <!-- 2. The Success Alert View Overlay (Handled by password-reset-success.html view instead) -->
    <div class="success-state" id="successState">
        <div class="success-icon">✓</div>
        <h2>Password Changed!</h2>
        <p>Your database credentials have been securely updated.</p>
        <p style="font-size: 13px; color: #95a5a6;">
            This window will close automatically in <span id="timer" class="countdown">3</span> seconds...
        </p>
    </div>
</div>

<script th:inline="javascript">
    const form = document.getElementById('resetForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const errorBlock = document.getElementById('errorBlock');

    form.addEventListener('submit', function(event) {
        // Clear any old alerts
        errorBlock.style.display = 'none';

        // 1. Client-side security verification match check
        if (password.value !== confirmPassword.value) {
            // Block standard submission if inputs do not match
            event.preventDefault();
            errorBlock.textContent = "Passwords do not match. Please re-enter.";
            errorBlock.style.display = 'block';
            return;
        }

        // 2. Form submission proceeds naturally via a standard POST navigation payload.
        // Spring Boot intercepts the body parameters, updates TokenManagementService,
        // and navigates the browser window directly to your success view.
    });
</script>
</body>
</html>
