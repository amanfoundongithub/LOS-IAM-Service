spring:
  application:
    name: identity-and-access-management-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/user_db

server:
  port: 5600

logging:
  level:
    root: INFO

info:
  app:
    name: ${spring.application.name}
    description: Service to manage identity and access
    version: 1.0.0
  base_url: "/api/v1/auth"

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always