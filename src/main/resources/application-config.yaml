spring:
  application:
    name: identity-and-access-management-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/user_db

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${secret.mail.username}
    password: ${secret.mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

app:
  mail:
    from-email: ${secret.mail.username}
    from-name: Identity & Access Management Service (IAM)

  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 500
    thread-name-prefix: "iam-async-"
  base-url: http://localhost:5600/api/v1/auth

  bucket:
    capacity: 100
    refill: 100
    intervalInMinutes: 1

user:
  max_attempts: 5
  lockout_minutes: 15

mdc:
  header: X-Trace-Id
  key: traceId

server:
  port: 5600

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [Trace: %X{${mdc.key}:-NoTrace}] - %msg%n"
info:
  app:
    name: ${spring.application.name}
    description: Service to manage identity and access
    version: 1.0.0
  base_url: "/api/v1/auth"

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always